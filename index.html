    // 📐 哈弗辛公式 (Haversine Formula) 計算地球表面兩點真實的直線距離 (單位：公尺)
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000; // 地球半徑
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) + 
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c; 
    }

    // 初始化地圖（中心預設在台南市東區）
    const map = L.map('map').setView([22.985, 120.230], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let userGroup = L.layerGroup().addTo(map);
    let storeGroup = L.layerGroup().addTo(map);

    // 把 95 家便利商店當作灰色小圓點撒在地圖上
    stores.forEach(s => {
      L.circleMarker([s.y, s.x], { 
        radius: 4, 
        color: '#7d6c6c', 
        fillColor: '##7d6c6c', 
        fillOpacity: 0.4 
      }).addTo(map).bindPopup(`<b>${s.name}</b><br>${s.address}`);
    });

    // 尋找最近 3 家店的核心運算邏輯
    function findNearestThree(centerLat, centerLon) {
      userGroup.clearLayers();
      storeGroup.clearLayers();

      // 在當前中心點插一根藍色大圖釘
      L.marker([centerLat, centerLon]).addTo(userGroup).bindPopup("您的定位位置").openPopup();

      // 挨家挨戶計算與中心點的距離
      stores.forEach(s => {
        s.currentDistance = getDistance(centerLat, centerLon, s.y, s.x);
      });

      // 排序並撈出前三名
      const sortedStores = [...stores].sort((a, b) => a.currentDistance - b.currentDistance);
      const top3 = sortedStores.slice(0, 3);

      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";

      top3.forEach((shop, index) => {
        const dist = Math.round(shop.currentDistance);
        
        // 1. 寫入左邊清單
        resultsDiv.innerHTML += `
          <div class="result-item">
            <b>${index + 1}. ${shop.name}</b> (<span class="distance-tag">${dist} 公尺</span>)<br>
            <span style="color:#666; font-size:12px;">${shop.address}</span>
          </div>`;

        // 2. 在地圖上將前三名標記為醒目的紅色大圓圈
        L.circleMarker([shop.y, shop.x], { 
          radius: 8, 
          color: '#dc3545', 
          fillColor: '#dc3545', 
          fillOpacity: 0.8 
        }).addTo(storeGroup).bindPopup(`<b>${shop.name}</b><br>距離：${dist} 公尺`);

        // 3. 畫一條導引紅色虛線
        L.polyline([[centerLat, centerLon], [shop.y, shop.x]], { 
          color: '#dc3545', 
          weight: 2, 
          dashArray: '5, 5' 
        }).addTo(storeGroup);
      });

      // 自動縮放地圖視野，讓使用者跟最近的三家店同時完美出現在畫面中
      const bounds = L.latLngBounds([
        [centerLat, centerLon],
        ...top3.map(s => [s.y, s.x])
      ]);
      map.fitBounds(bounds.pad(0.2));
    }

    // 🖱 點擊地圖任意地方觸發搜尋
    map.on('click', function(e) {
      document.getElementById("status").innerHTML = "🟢 地圖點擊定位成功！";
      findNearestThree(e.latlng.lat, e.latlng.lng);
    });

    // 🔍 搜尋地址按鈕觸發
    document.getElementById("searchBtn").addEventListener("click", function() {
      const address = document.getElementById("addressInput").value;
      if (!address) return alert("請輸入地址！");
      
      document.getElementById("status").innerHTML = "🟡 正在解析地址座標...";

      // 使用完全免費的 OpenStreetMap 定位引擎（Nominatim API）
      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1`)
        .then(res => res.json())
        .then(results => {
          if (results.length === 0) {
            document.getElementById("status").innerHTML = "🔴 找不到地址，請試著換個寫法或手動點地圖。";
            return alert("找不到該地址，請輸入更具體的格式（例如包含台南市東區）！");
          }
          const lat = parseFloat(results[0].lat);
          const lon = parseFloat(results[0].lon);
          document.getElementById("status").innerHTML = "🟢 地址搜尋成功！";
          findNearestThree(lat, lon);
        })
        .catch(err => {
          document.getElementById("status").innerHTML = "🔴 定位服務忙碌，請直接用滑鼠點擊地圖。";
        });
    });
  </script>
</body>
</html>
